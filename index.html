<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중국 체인점 지점 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f1; --surface:#ffffff; --ink:#16282b; --muted:#5b6e71; --line:#d3dcdb; --accent:#0f6b5c; --accent-ink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a1c; --surface:#172528; --ink:#e6efee; --muted:#93a8ab; --line:#2a3d41; --accent:#4fc3ab; --accent-ink:#06201a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a1c; --surface:#172528; --ink:#e6efee; --muted:#93a8ab; --line:#2a3d41; --accent:#4fc3ab; --accent-ink:#06201a;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.55}
main{max-width:920px;margin:0 auto;padding:40px 20px 64px}
h1{font-size:clamp(28px,6vw,44px);font-weight:900;letter-spacing:-0.02em;margin:0 0 8px;line-height:1.15}
.lead{color:var(--muted);margin:0 0 28px;max-width:60ch}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search input:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.search button{font:inherit;font-weight:700;padding:0 22px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.search button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 28px}
.chips button{font:inherit;font-size:14px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.chips button:focus-visible{outline:2px solid var(--accent)}
#head{margin:0 0 16px;min-height:1.6em}
#head .city{font-size:22px;font-weight:700}
#head .alt{color:var(--muted);margin-left:8px}
#head .warn{color:var(--muted);font-size:14px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:14px 16px}
.card h2{margin:0;font-size:18px;font-weight:700}
.card .zh{color:var(--muted);font-size:14px;margin:0}
.logo{flex:none;width:72px;height:56px;border-radius:10px;border:1px solid var(--line);object-fit:contain;background:#fff}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.badge{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:900;background:var(--c);color:var(--t,#fff)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:14px;font-weight:500;text-decoration:none;color:var(--ink);padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.links a:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.links a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.empty{color:var(--muted);padding:28px 0}
.note{margin-top:32px;color:var(--muted);font-size:13px;max-width:70ch}
</style>
</head>
<body>
<main>
  <h1>중국 체인점 지점 찾기</h1>
  <p class="lead">도시 이름을 한글, 영어, 중국어 중 편한 대로 입력하면 8개 브랜드의 지점 검색 결과를 지도로 바로 열어줘요.</p>

  <div class="search" role="search">
    <input id="q" list="cities" type="text" placeholder="예: 항저우 / Hangzhou / 杭州" autocomplete="off" aria-label="도시 이름">
    <button id="go" type="button">지점 보기</button>
  </div>
  <datalist id="cities"></datalist>
  <div class="chips" id="chips" aria-label="자주 찾는 도시"></div>

  <div id="head" aria-live="polite"></div>
  <div class="grid" id="out"></div>

  <p class="note">지점 목록은 각 지도 서비스에서 실시간으로 보여줘요. 고덕지도(高德地图)와 바이두 지도는 해외에서 느리거나 일부 기능이 제한될 수 있고, 그럴 땐 구글 지도를 이용해 주세요. 입력한 도시가 목록에 없어도 입력한 이름 그대로 검색해요.</p>
</main>

  var BRANDS = [
    {ko:"루이싱커피",zh:"瑞幸咖啡",q:"瑞幸咖啡",c:"#1a3d9c"},
    {ko:"헤이티",zh:"喜茶",q:"喜茶",c:"#e0a800",t:"#16282b"},
    {ko:"패왕차희",zh:"霸王茶姬",q:"霸王茶姬",c:"#b3262e"},
    {ko:"모어요거트",zh:"茉酸奶",q:"茉酸奶",c:"#d9648c"},
    {ko:"스타벅스",zh:"星巴克",q:"星巴克",c:"#00704a"},
    {ko:"야인선생",zh:"野人先生",q:"野人先生",c:"#6b4f2a"},
    {ko:"미쉐빙청",zh:"蜜雪冰城",q:"蜜雪冰城",c:"#d5262b"},
    {ko:"바오스푸",zh:"鲍师傅糕点",q:"鲍师傅",c:"#e6762e"}
  ];

  function norm(s){
    return s.toLowerCase().replace(/[\s'’\-\.]/g,"").replace(/(시|市|city)$/,"");
  }
  function findCity(input){
    var n = norm(input);
    if(!n) return null;
    var i, j, c;
    for(i=0;i<CITIES.length;i++){
      c = CITIES[i];
      for(j=0;j<3;j++){ if(norm(c[j])===n) return c; }
    }
    for(i=0;i<CITIES.length;i++){
      c = CITIES[i];
      for(j=0;j<3;j++){ if(n.length>=2 && norm(c[j]).indexOf(n)===0) return c; }
    }
    return null;
  }

  var dl = document.getElementById("cities");
  var chips = document.getElementById("chips");
  CITIES.forEach(function(c){
    var o = document.createElement("option");
    o.value = c[0];
    o.label = c[1]+" / "+c[2];
    dl.appendChild(o);
  });
  ["베이징","상하이","광저우","선전","청두","항저우","시안","칭다오","홍콩"].forEach(function(name){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = name;
    b.addEventListener("click", function(){ document.getElementById("q").value = name; run(); });
    chips.appendChild(b);
  });

  function link(href, label){
    var a = document.createElement("a");
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = label;
    return a;
  }

  function run(){
    var raw = document.getElementById("q").value.trim();
    var head = document.getElementById("head");
    var out = document.getElementById("out");
    head.innerHTML = ""; out.innerHTML = "";
    if(!raw){
      var e = document.createElement("div");
      e.className = "empty"; e.textContent = "도시 이름을 입력해 주세요.";
      out.appendChild(e);
      return;
    }
    var hit = findCity(raw);
    var zhCity = hit ? hit[2] : raw;
    var t = document.createElement("div");
    var s1 = document.createElement("span"); s1.className = "city"; s1.textContent = hit ? hit[0] : raw;
    t.appendChild(s1);
    if(hit){
      var s2 = document.createElement("span"); s2.className = "alt"; s2.textContent = hit[2]+" · "+hit[1];
      t.appendChild(s2);
    }
    head.appendChild(t);
    if(!hit){
      var w = document.createElement("div"); w.className = "warn";
      w.textContent = "목록에 없는 도시예요. 입력한 이름 그대로 검색하니, 결과가 부정확하면 중국어 도시명으로 다시 입력해 보세요.";
      head.appendChild(w);
    }
    BRANDS.forEach(function(b){
      var q = zhCity + " " + b.q;
      var enc = encodeURIComponent(q);
      var card = document.createElement("div");
      card.className = "card"; card.style.setProperty("--c", b.c);
      var h = document.createElement("h2"); h.textContent = b.ko;
      var z = document.createElement("p"); z.className = "zh"; z.textContent = b.zh;
      var l = document.createElement("div"); l.className = "links";
      l.appendChild(link("https://www.google.com/maps/search/"+enc, "구글 지도"));
      l.appendChild(link("https://www.amap.com/search?query="+enc, "고덕지도"));
      l.appendChild(link("https://map.baidu.com/search/"+enc+"?querytype=s&wd="+enc, "바이두 지도"));
      var top = document.createElement("div"); top.className = "top";
      var badge = document.createElement("div"); badge.className = "badge"; badge.setAttribute("aria-hidden","true");
      badge.textContent = b.zh.charAt(0);
      if(b.t) badge.style.setProperty("--t", b.t);
      var names = document.createElement("div"); names.appendChild(h); names.appendChild(z);
      var mark = badge;
      if(LOGOS[b.zh]){ mark = document.createElement("img"); mark.className = "logo"; mark.src = LOGOS[b.zh]; mark.alt = b.ko + " 로고"; }
      top.appendChild(mark); top.appendChild(names);
      card.appendChild(top); card.appendChild(l);
      out.appendChild(card);
    });
  }

  document.getElementById("go").addEventListener("click", run);
  document.getElementById("q").addEventListener("keydown", function(e){ if(e.key==="Enter") run(); });
})();
</script>
